  <path d="M0 650c260-116 453-76 640 32 148 86 288 99 466 25 111-46 223-49 334-13v406H0Z" fill="url(#fairway)"/>
  <path d="M0 788c245-88 448-64 615 44 157 102 352 97 519 31 115-45 214-41 306-12v249H0Z" fill="#061b16" opacity=".84"/>
  <path d="M-96 682C217 472 502 442 830 516c162 36 305 35 461-9 88-25 169-31 245-18" fill="none" stroke="url(#arc)" stroke-width="7" filter="url(#softGlow)" opacity=".82"/>
  <path d="M-104 693C220 485 501 457 826 529c166 37 311 35 469-10 86-24 164-29 239-17" fill="none" stroke="#a6e6bd" stroke-width="1.5" opacity=".62"/>
