<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">Dark golf course at dusk</title>
  <desc id="desc">A stylized green golf landscape with distant hills, a flag, and a glowing swing arc.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061518"/>
      <stop offset=".5" stop-color="#05201d"/>
      <stop offset="1" stop-color="#031310"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".28" r=".55">
      <stop offset="0" stop-color="#245847" stop-opacity=".48"/>
      <stop offset=".48" stop-color="#0b2d28" stop-opacity=".18"/>
      <stop offset="1" stop-color="#031310" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fairway" x1="0" y1=".1" x2=".65" y2="1">
      <stop offset="0" stop-color="#143d31"/>
      <stop offset=".58" stop-color="#08271f"/>
      <stop offset="1" stop-color="#041914"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d394" stop-opacity="0"/>
      <stop offset=".35" stop-color="#56d394" stop-opacity=".86"/>
      <stop offset=".75" stop-color="#d6b85d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d6b85d" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1440" height="1100" fill="url(#sky)"/>
  <rect width="1440" height="1100" fill="url(#glow)"/>
