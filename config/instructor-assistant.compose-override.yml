# Copy onto gitignored docker-compose.override.yml. Inventory: docs/ssmlabs-fork-patches.md
# Do not bind-mount ./client/dist — overlays patch the published image instead.
services:
  api:
    environment:
      SCHEDULES_SINGLE_PROCESS: "true"
      APP_TITLE: Ask Lesson Caddie Assistant
      APP_SHORT_NAME: Ask Caddie
      SSMLABS_BRANDING_ASSET_VERSION: "1"
      HIDE_TOOL_ACTIVITY: "true"
      INSTRUCTOR_ASSISTANT_MODEL: gpt-4o
      LESSONCADDIE_HOME_URL: https://lessoncaddie.ssmlabs.com/app
      LESSONCADDIE_ALLOWED_ORIGINS: https://lessoncaddie.ssmlabs.com,http://127.0.0.1:3021,http://localhost:3021
      X_FRAME_OPTIONS: "off"
      CROSS_ORIGIN_RESOURCE_POLICY: same-site
      CSP_FRAME_ANCESTORS: "'self' https://lessoncaddie.ssmlabs.com http://127.0.0.1:3021"
      LESSONCADDIE_HIDE_MODEL_SELECTOR: "true"
      # inject-index-html keeps api/server/index.js upstream; attach-sso is a no-op until enabled.
      NODE_OPTIONS: --require /app/config/ssmlabs/inject-index-html.js --require /app/config/ssmlabs/attach-lessoncaddie-sso.js
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./api/server/routes/config.js:/app/api/server/routes/config.js:ro
      - ./api/server/routes/messages.js:/app/api/server/routes/messages.js:ro
      - ./api/server/utils/hideToolActivity.js:/app/api/server/utils/hideToolActivity.js:ro
      - ./api/server/controllers/agents/callbacks.js:/app/api/server/controllers/agents/callbacks.js:ro
      - ./config/provision-instructor-assistant.js:/app/config/provision-instructor-assistant.js:ro
      - ./config/ssmlabs:/app/config/ssmlabs:ro
      - ./config/ssmlabs/hide-model-selector.browser.js:/app/client/dist/ssmlabs/hide-model-selector.js:ro
      - ./config/ssmlabs/lessonCaddieNavigationBridge.browser.js:/app/client/dist/ssmlabs/lesson-caddie-navigation-bridge.js:ro
      - ./config/ssmlabs/embed-passthrough-sw.js:/app/client/dist/sw.js:ro
      - ./config/ssmlabs/branding/manifest.webmanifest:/app/client/dist/manifest.webmanifest:ro
      - ./config/ssmlabs/branding/assets/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png:ro
      - ./config/ssmlabs/branding/assets/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png:ro
      - ./config/ssmlabs/branding/assets/apple-touch-icon-180x180.png:/app/client/dist/assets/apple-touch-icon-180x180.png:ro
      - ./config/ssmlabs/branding/assets/icon-192x192.png:/app/client/dist/assets/icon-192x192.png:ro
      - ./config/ssmlabs/branding/assets/icon-512x512.png:/app/client/dist/assets/icon-512x512.png:ro
      - ./config/ssmlabs/branding/assets/maskable-icon.png:/app/client/dist/assets/maskable-icon.png:ro
      - ./config/ssmlabs/branding/assets/logo.svg:/app/client/dist/assets/logo.svg:ro
